; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200
monitor_port  = /dev/ttyACM0

[platformio]
default_envs = stm32f4

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = 
	-DENV_TEENSY -DUSB_SERIAL -DTEENSY_OPT_SMALLEST_CODE
	-DUTF8_DISP -DBCD_MATH
	-fno-exceptions
	-Wl,--gc-sections
	-L${PROJECT_DIR}/lib/IntelRDFPMathLib20U1
	-lgcc111libbid-arm
	-lm
lib_deps = adafruit/Adafruit NeoPixel@^1.15.2

[env:stm32f4]
platform = ststm32
board = nucleo_f411re
framework = arduino
build_flags = 
	-DENV_STM32F4xx -DUTF8_DISP
lib_deps = adafruit/Adafruit NeoPixel@^1.15.2

[env:native]
platform = native
build_flags = 
	-DENV_NATIVE -DUSE_CURSES -DUTF8_DISP -DBCD_MATH
	-L${PROJECT_DIR}/lib/IntelRDFPMathLib20U1
	-lgcc111libbid-arm64
	-lncurses  -lm -g -O0
